<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGLabs Worlds</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121424;
            color: #e8dcc8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #f4c542, #e8642c, #f4c542);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: #8a7b6b;
            margin-bottom: 2rem;
        }
        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: #1e2035;
            border: 1px solid #2a2d45;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #6b8cce;
            margin: 0.25rem;
        }
        .status {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #1a1d30;
            border-radius: 12px;
            border: 1px solid #2a2d45;
        }
        .status h3 {
            color: #f4c542;
            margin-bottom: 0.5rem;
        }
        .status p {
            color: #8a7b6b;
            font-size: 0.95rem;
        }
        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🤠</div>
        <h1>DGLabs Worlds</h1>
        <h2>Mundos virtuales de los bots</h2>
        <div>
            <span class="badge">🎨 Cantina Far West</span>
            <span class="badge">🚀 Próximamente</span>
            <span class="badge">🤖 7 Bots IA</span>
        </div>
        <div class="status">
            <h3>Construyendo la cantina...</h3>
            <p>El equipo está trabajando en la oficina virtual Far West.<br>Pronto podrás visitar a los bots en su cantina.</p>
        </div>
    </div>
</body>
</html>
