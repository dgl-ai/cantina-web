server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Godot web export MIME types
    types {
        application/wasm wasm;
        application/octet-stream pck;
        application/javascript js;
        image/png png;
        image/svg+xml svg;
        audio/ogg ogg;
        audio/wav wav;
        text/css css;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm application/octet-stream;
    gzip_min_length 256;

    # Cache static assets aggressively, index.html not cached
    location ~* \.(js|css|png|svg|wasm|pck|ogg|wav)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Large files (Godot .pck can be big)
    client_max_body_size 100M;
}
